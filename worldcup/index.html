<meta name="apple-mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="World Cup" />
<link rel="manifest" href="manifest.json" />
<!-- iOS Add-to-Home-Screen uses apple-touch-icon (PNG; SVG is ignored there). -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Fredoka', sans-serif; overflow-x: hidden;
    background: radial-gradient(circle at 18% 0%, #3a7bef 0%, #244fb5 42%, #15327f 78%, #0f2566 100%); background-attachment: fixed; }
  button, select { font-family: inherit; }
  select option { color: #16235a; }
  @keyframes factfade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 10px; }
  /* horizontal tab strip on phones — hide its scrollbar */
  .tabstrip { scrollbar-width: none; -ms-overflow-style: none; }
  .tabstrip::-webkit-scrollbar { display: none; }
  /* live standings drama: a pulsing dot for teams playing now + a glow when a row moves */
  @keyframes wcpulse { 0%,100%{ opacity:1 } 50%{ opacity:.2 } }
  .wc-live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#e2473b; box-shadow:0 0 6px #e2473b; animation:wcpulse 1.1s ease-in-out infinite; flex:none; }
  @keyframes wcglow { 0%{ box-shadow:0 0 0 2px rgba(244,183,64,.95) inset } 100%{ box-shadow:0 0 0 0 rgba(244,183,64,0) inset } }
  .wc-moved { animation: wcglow 1s ease-out 1; }
  /* drama ticker: each new "what just changed" row slides+fades in */
  @keyframes wcdramain { from { opacity:0; transform: translateY(-8px) } to { opacity:1; transform:none } }
  .wc-drama-row { animation: wcdramain .5s ease-out; }
  /* live in-game stats: a goal scrolling into the hero ticker, and the momentum tug-of-war bar */
  @keyframes wcgoalin { from { opacity:0; transform: translateX(-10px) } to { opacity:1; transform:none } }
  .wc-goal-row { animation: wcgoalin .45s ease-out; }
  .wc-mom-fill { transition: flex-grow .6s cubic-bezier(.4,0,.2,1); }
  /* post-pool pivot: a one-shot "knockouts are set" reveal + a gentle cascade for the story pills */
  @keyframes wckoreveal { from { opacity:0; transform: scale(.96) translateY(8px) } to { opacity:1; transform:none } }
  .wc-ko-reveal { animation: wckoreveal .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes wcfactin { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
  .wc-fact-pill { animation: wcfactin .5s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .wc-drama-row, .wc-goal-row, .wc-ko-reveal, .wc-fact-pill { animation: none }
    .wc-live-dot { animation: none } .wc-mom-fill { transition: none }
  }
</style>
</head>

<!-- PWA: register the /worldcup/-scoped service worker so the Hub works fully
     OFFLINE once opened on the network. Needs a secure context (https:// or
     localhost). Relative path → scope is /worldcup/ (self-contained). -->
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('[pwa] service worker registration failed:', err);
      });
    });
  }
</script>
